<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dense Scorpion Cursor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;cursor:none}
#label{
 position:fixed;top:18px;left:50%;transform:translateX(-50%);
 color:rgba(255,255,255,.35);font:11px Arial;letter-spacing:4px;
 pointer-events:none;text-transform:uppercase
}
</style>
</head>
<body>
<div id="label">SCORPION CURSOR</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize); resize();

const mouse={x:W/2,y:H/2};
const target={x:W/2,y:H/2};
addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("touchmove",e=>{
 const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY;
},{passive:true});

/* Dense segmented body */
const N=38, GAP=15;
const body=[];
for(let i=0;i<N;i++){
 body.push({
   x:W/2-i*GAP,y:H/2,
   r: i<5 ? 10-i*.35 : Math.max(2.1,7.2-i*.13),
   phase:i*.27
 });
}

/* 12 articulated legs = dense skeleton look */
const legs=[];
for(let i=0;i<12;i++){
 legs.push({
   side:i%2?-1:1,
   index:5+Math.floor(i/2)*2,
   phase:i*.9,
   reach:22+(i%3)*5
 });
}

/* floating micro particles following the body */
const particles=[];
for(let i=0;i<130;i++){
 particles.push({
   x:Math.random()*W,y:Math.random()*H,
   vx:0,vy:0,
   life:Math.random(),
   seed:Math.random()*1000
 });
}

function lerp(a,b,t){return a+(b-a)*t}

function follow(){
 target.x=lerp(target.x,mouse.x,.18);
 target.y=lerp(target.y,mouse.y,.18);

 body[0].x=lerp(body[0].x,target.x,.25);
 body[0].y=lerp(body[0].y,target.y,.25);

 for(let i=1;i<N;i++){
   const p=body[i-1],b=body[i];
   let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy)||1;
   b.x=p.x+dx/d*GAP;
   b.y=p.y+dy/d*GAP;
 }
}

function seg(x1,y1,x2,y2,w=1,a=.55){
 ctx.strokeStyle=`rgba(225,225,225,${a})`;
 ctx.lineWidth=w;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}

function dot(x,y,r=1.5,a=.7){
 ctx.fillStyle=`rgba(245,245,245,${a})`;
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}

function drawLeg(L){
 const b=body[L.index];
 const prev=body[Math.max(0,L.index-1)];
 const next=body[Math.min(N-1,L.index+1)];
 const angle=Math.atan2(next.y-prev.y,next.x-prev.x);
 const side=L.side;

 const nx=-Math.sin(angle)*side;
 const ny=Math.cos(angle)*side;
 const tx=Math.cos(angle),ty=Math.sin(angle);

 const hip={x:b.x+nx*b.r*.9,y:b.y+ny*b.r*.9};

 /* forward/backward sweep makes legs look organic */
 const forward=L.index<15 ? .85 : -.25;
 const swing=Math.sin(performance.now()*.002+L.phase)*3;

 const knee={
   x:hip.x+tx*(13*forward)+nx*(L.reach+swing),
   y:hip.y+ty*(13*forward)+ny*(L.reach+swing)
 };

 const ankle={
   x:knee.x+tx*(13*forward)+nx*(10+L.reach*.22),
   y:knee.y+ty*(13*forward)+ny*(10+L.reach*.22)
 };

 const foot={
   x:ankle.x+tx*(8*forward)+nx*5,
   y:ankle.y+ty*(8*forward)+ny*5
 };

 seg(hip.x,hip.y,knee.x,knee.y,1.15,.48);
 seg(knee.x,knee.y,ankle.x,ankle.y,.95,.55);
 seg(ankle.x,ankle.y,foot.x,foot.y,.75,.65);

 dot(hip.x,hip.y,1.4,.7);
 dot(knee.x,knee.y,1.6,.8);
 dot(ankle.x,ankle.y,1.35,.8);
 dot(foot.x,foot.y,1.25,.85);

 /* tiny hair-like branch */
 const ba=Math.atan2(foot.y-ankle.y,foot.x-ankle.x);
 seg(foot.x,foot.y,
     foot.x+Math.cos(ba+side*.55)*8,
     foot.y+Math.sin(ba+side*.55)*8,.55,.32);
}

function drawBody(){
 for(let i=N-1;i>=0;i--){
   const b=body[i];
   const p=body[Math.max(0,i-1)];
   const n=body[Math.min(N-1,i+1)];
   const a=Math.atan2(n.y-p.y,n.x-p.x);
   const nx=-Math.sin(a),ny=Math.cos(a);

   /* dense transverse ribs */
   const rings=i<7?3:2;
   for(let q=-rings;q<=rings;q++){
     const off=q*1.9;
     const rr=b.r+off;
     if(rr<=.3) continue;
     ctx.strokeStyle=`rgba(235,235,235,${i<10?.34:.22})`;
     ctx.lineWidth=.55;
     ctx.beginPath();
     ctx.moveTo(b.x-nx*rr,b.y-ny*rr);
     ctx.lineTo(b.x+nx*rr,b.y+ny*rr);
     ctx.stroke();
   }

   /* center vertebra */
   dot(b.x,b.y,i<5?2.1:1.15,i<8?.8:.48);

   /* paired tiny side spikes */
   if(i%2===0 && i>4 && i<N-3){
     const s=b.r+3;
     seg(b.x-nx*s,b.y-ny*s,b.x-nx*(s+4),b.y-ny*(s+4),.55,.28);
     seg(b.x+nx*s,b.y+ny*s,b.x+nx*(s+4),b.y+ny*(s+4),.55,.28);
   }
 }
}

function drawHead(){
 const h=body[0], b=body[1];
 const a=Math.atan2(h.y-b.y,h.x-b.x);
 const nx=-Math.sin(a),ny=Math.cos(a);
 const tx=Math.cos(a),ty=Math.sin(a);

 /* head plates */
 for(const s of [-1,1]){
   const p1={x:h.x+tx*7+nx*s*7,y:h.y+ty*7+ny*s*7};
   const p2={x:h.x+tx*17+nx*s*10,y:h.y+ty*17+ny*s*10};
   seg(p1.x,p1.y,p2.x,p2.y,1.4,.7);
 }
 /* pincers */
 for(const s of [-1,1]){
   const hip={x:h.x+tx*5+nx*s*8,y:h.y+ty*5+ny*s*8};
   const elbow={x:h.x+tx*19+nx*s*19,y:h.y+ty*19+ny*s*19};
   const tip={x:elbow.x+tx*12+nx*s*5,y:elbow.y+ty*12+ny*s*5};
   seg(hip.x,hip.y,elbow.x,elbow.y,1.35,.75);
   seg(elbow.x,elbow.y,tip.x,tip.y,1.05,.8);
   seg(tip.x,tip.y,
       tip.x+tx*7+nx*s*4,
       tip.y+ty*7+ny*s*4,.8,.8);
   dot(elbow.x,elbow.y,1.6,.85);
 }
 /* antennae */
 for(const s of [-1,1]){
   const x=h.x+tx*10+nx*s*5, y=h.y+ty*10+ny*s*5;
   seg(x,y,x+tx*13+nx*s*10,y+ty*13+ny*s*10,.65,.5);
   dot(x+tx*13+nx*s*10,y+ty*13+ny*s*10,1.2,.8);
 }
}

function drawTail(){
 let i=N-1;
 let p=body[i], q=body[i-1];
 let a=Math.atan2(p.y-q.y,p.x-q.x);
 let x=p.x,y=p.y;

 for(let k=0;k<10;k++){
   const bend=(k<5?.23:-.36);
   a+=bend*.32;
   const len=16-k*.7;
   const nx=x+Math.cos(a)*len,ny=y+Math.sin(a)*len;
   const radius=Math.max(1,3.6-k*.25);

   /* tail segment */
   seg(x,y,nx,ny,1.15,.62);
   ctx.strokeStyle="rgba(235,235,235,.34)";
   ctx.lineWidth=.6;
   ctx.beginPath();
   ctx.arc(nx,ny,radius,0,Math.PI*2);ctx.stroke();
   dot(nx,ny,1.25,.72);

   /* tail barbs */
   if(k<8){
     const side=k%2?-1:1;
     seg(nx,ny,
       nx+Math.cos(a+side*.9)*6,
       ny+Math.sin(a+side*.9)*6,.55,.34);
   }
   x=nx;y=ny;
 }
 /* stinger */
 seg(x,y,x+Math.cos(a-.7)*15,y+Math.sin(a-.7)*15,1.25,.9);
 dot(x+Math.cos(a-.7)*15,y+Math.sin(a-.7)*15,1.8,.95);
}

function drawParticles(){
 for(const p of particles){
   const dx=target.x-p.x,dy=target.y-p.y;
   const d=Math.hypot(dx,dy)||1;
   if(d<230){
     p.vx+=dx/d*.025;
     p.vy+=dy/d*.025;
   }
   p.vx*=.985;p.vy*=.985;
   p.x+=p.vx;p.y+=p.vy;

   if(p.x<0||p.x>W||p.y<0||p.y>H){
     p.x=Math.random()*W;p.y=Math.random()*H;p.vx=p.vy=0;
   }

   const near=Math.max(0,1-d/260);
   if(near>.05) dot(p.x,p.y,.45,.12*near);
 }
}

function render(){
 ctx.clearRect(0,0,W,H);
 follow();

 drawParticles();
 legs.forEach(drawLeg);
 drawTail();
 drawHead();
 drawBody();

 /* cursor point */
 ctx.fillStyle="rgba(255,255,255,.9)";
 ctx.beginPath();ctx.arc(mouse.x,mouse.y,1.5,0,Math.PI*2);ctx.fill();

 requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
